name: CI / CD - Vercel Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI JOB: Lint, Typecheck, and Test Production Build
  # =========================================================================
  ci:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate Linting
        run: npm run lint
        continue-on-error: true

      - name: Verify TypeScript Compilation & Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  # =========================================================================
  # 2. CD JOB: Deploy Preview to Vercel (Pull Requests)
  # =========================================================================
  deploy-preview:
    name: Deploy Vercel Preview
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Secrets & Deploy Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning ::VERCEL_TOKEN secret is missing in GitHub Repository Settings. Skipping Vercel preview deployment."
            echo "To enable automated preview deployment, add VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID under Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          echo "Installing latest official Vercel CLI..."
          npm install --no-save vercel@latest

          echo "Pulling Vercel Environment Configuration..."
          npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

          echo "Building project artifacts with Vercel..."
          npx vercel build --token=$VERCEL_TOKEN

          echo "Deploying preview build..."
          npx vercel deploy --prebuilt --token=$VERCEL_TOKEN

  # =========================================================================
  # 3. CD JOB: Deploy to Production (Push to Main / Master)
  # =========================================================================
  deploy-production:
    name: Deploy Vercel Production
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Secrets & Deploy Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error ::VERCEL_TOKEN secret is missing in GitHub Repository Settings."
            echo "Please add VERCEL_TOKEN under Settings -> Secrets and variables -> Actions in your GitHub repository."
            exit 1
          fi

          echo "Installing latest official Vercel CLI..."
          npm install --no-save vercel@latest

          echo "Pulling Vercel Environment Configuration..."
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

          echo "Building production artifacts with Vercel..."
          npx vercel build --prod --token=$VERCEL_TOKEN

          echo "Deploying production build..."
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
