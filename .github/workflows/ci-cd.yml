name: CI / CD - Vercel Deployment

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI JOB: Lint, Typecheck, and Test Production Build
  # =========================================================================
  ci:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Validate Linting
        run: npm run lint
        continue-on-error: true

      - name: Verify TypeScript Compilation & Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  # =========================================================================
  # 2. CD JOB: Deploy Preview to Vercel (Pull Requests)
  # =========================================================================
  deploy-preview:
    name: Deploy Vercel Preview
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning ::VERCEL_TOKEN secret is missing in GitHub Repository Settings. Skipping Vercel preview deployment."
            exit 0
          fi

          echo "Installing latest official Vercel CLI..."
          npm install --no-save vercel@latest

          PROJECT_ID="${VERCEL_PROJECT_ID:-prj_5dGz3iQGKBDqWkmdgGS4dWgZ7XJz}"
          ORG_ID="${VERCEL_ORG_ID:-team_5h1r4VemqghQLJg0dyH9oDQx}"

          echo "Linking Vercel project configuration..."
          mkdir -p .vercel
          cat << EOF > .vercel/project.json
          {
            "projectId": "$PROJECT_ID",
            "orgId": "$ORG_ID"
          }
          EOF

          echo "Attempting prebuilt preview deployment..."
          if npx vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"; then
            npx vercel build --token="$VERCEL_TOKEN"
            npx vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          else
            echo "Prebuilt pull failed, falling back to direct preview deploy..."
            npx vercel deploy --token="$VERCEL_TOKEN" --yes
          fi

  # =========================================================================
  # 3. CD JOB: Deploy to Production (Push to Main / Master)
  # =========================================================================
  deploy-production:
    name: Deploy Vercel Production
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error ::VERCEL_TOKEN secret is missing in GitHub Repository Settings."
            exit 1
          fi

          echo "Installing latest official Vercel CLI..."
          npm install --no-save vercel@latest

          PROJECT_ID="${VERCEL_PROJECT_ID:-prj_5dGz3iQGKBDqWkmdgGS4dWgZ7XJz}"
          ORG_ID="${VERCEL_ORG_ID:-team_5h1r4VemqghQLJg0dyH9oDQx}"

          echo "Linking Vercel project configuration..."
          mkdir -p .vercel
          cat << EOF > .vercel/project.json
          {
            "projectId": "$PROJECT_ID",
            "orgId": "$ORG_ID"
          }
          EOF

          echo "Attempting prebuilt production deployment..."
          if npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"; then
            npx vercel build --prod --token="$VERCEL_TOKEN"
            npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            echo "Prebuilt pull failed, falling back to direct production deploy..."
            npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes
          fi
